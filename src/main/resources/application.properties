# Configuração do Banco de Dados H2 (Arquivo Local Persistente) - Permite que os dados sobrevivam ao reiniciar a aplicação

spring.datasource.url=jdbc:h2:file:./data/territory_db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configurações do Hibernate / JPA
# update: cria e atualiza as tabelas automaticamente sem apagar dados anteriores
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Desabilita o banner inicial do Spring para manter o console do menu limpo
spring.main.banner-mode=off