spring.application.name=territory-predictive-insights

# Configuração do Banco H2 gravando em ARQUIVO local
spring.datasource.url=jdbc:h2:file:./dados/monitoramento_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configurações do Hibernate/JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Desativa banner inicial para o console ficar limpo para o menu
spring.main.banner-mode=off